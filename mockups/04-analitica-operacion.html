      // root's never-relay rule) are what hold in fully opaque chains

        UUID_SHAPE.test(d.__bundler_page) &&

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animación&quot;}}\">\nconst LOOP = 12000;\nconst COUNT_START = 1600;\nconst COUNT_END = 2250;\nconst nf = new Intl.NumberFormat('es-CL');\n\nclass Component extends DCLogic {\n  rootRef = React.createRef();\n  ticketsRef = React.createRef();\n  frtRef = React.createRef();\n\n  renderVals() {\n    return { rootRef: this.rootRef, ticketsRef: this.ticketsRef, frtRef: this.frtRef };\n  }\n\n  componentDidMount() {\n    this.base = document.timeline.currentTime || 0;\n    this.hold = 0;\n    this.rate = 1;\n    this.userPlaying = false;\n    this.frames = 0;\n    this.applyProps();\n    this.tick = this.tick.bind(this);\n    // adereso-playback-v2\n    this.transport = event => {\n      if (event.source !== window.parent || event.data?.type !== 'adereso:playback') return;\n      cancelAnimationFrame(this.raf);\n      this.userPlaying = event.data.play === true;\n      this.applyProps();\n      if (this.userPlaying) {\n        this.setPhase(0);\n        this.raf = requestAnimationFrame(this.tick);\n      }\n      document.documentElement.dataset.mockupPlaying = String(this.userPlaying);\n      window.parent.postMessage({ type: 'adereso:state', playing: this.userPlaying }, '*');\n    };\n    document.documentElement.dataset.mockupPlaying = 'false';\n    window.addEventListener('message', this.transport);\n    Promise.resolve(document.fonts?.ready).then(() => {\n      window.parent.postMessage({ type: 'adereso:ready' }, '*');\n    });\n  }\n\n  componentDidUpdate() { this.applyProps(); }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener('message', this.transport);\n  }\n\n  animList() {\n    const root = this.rootRef.current;\n    return root && root.getAnimations ? root.getAnimations({ subtree: true }) : [];\n  }\n\n  phase() {\n    const a = this.refAnim;\n    if (!a) return this.hold || 0;\n    const t = a.currentTime || 0;\n    return ((t % LOOP) + LOOP) % LOOP;\n  }\n\n  applyProps() {\n    const root = this.rootRef.current;\n    if (!root) return;\n    root.style.setProperty('--k-blur', (this.props.entryBlur ?? 12) + 'px');\n    this.rate = this.props.speed ?? 1;\n    this.playing = this.userPlaying && !this.props.paused;\n    this.setPhase(this.phase());\n  }\n\n  setPhase(t) {\n    const now = document.timeline.currentTime || 0;\n    this.hold = t;\n    this.base = now - t / (this.rate || 1);\n    for (const a of this.animList()) {\n      try {\n        if (a.playbackRate !== this.rate) a.updatePlaybackRate(this.rate);\n        if (this.playing) {\n          if (a.playState === 'paused') a.play();\n          a.startTime = this.base;\n        } else {\n          if (a.playState !== 'paused') a.pause();\n          a.currentTime = t;\n        }\n      } catch (e) { /* animation not ready */ }\n    }\n  }\n\n  syncAnimations(force) {\n    if (!this.playing) return;\n    for (const a of this.animList()) {\n      try {\n        if (a.playState === 'paused') a.play();\n        if (a.playbackRate !== this.rate) a.updatePlaybackRate(this.rate);\n        if (force || a.startTime === null || Math.abs(a.startTime - this.base) > 1) a.startTime = this.base;\n      } catch (e) { /* animation not ready */ }\n    }\n  }\n\n  paint(t) {\n    let p = (t - COUNT_START) / (COUNT_END - COUNT_START);\n    p = p \u003c 0 ? 0 : p > 1 ? 1 : p;\n    const e = 1 - Math.pow(1 - p, 3);\n    const tickets = this.ticketsRef.current;\n    if (tickets) {\n      const txt = nf.format(Math.round(1284 * e));\n      if (tickets.textContent !== txt) tickets.textContent = txt;\n    }\n    const frt = this.frtRef.current;\n    if (frt) {\n      const txt = this.fmtDuration(84 * e);\n      if (frt.textContent !== txt) frt.textContent = txt;\n    }\n  }\n\n  fmtDuration(totalSeconds) {\n    const s = Math.round(totalSeconds);\n    if (s \u003c 60) return s + 's';\n    return Math.floor(s / 60) + 'm ' + String(s % 60) + 's';\n  }\n\n  t
